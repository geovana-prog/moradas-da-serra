<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Loteador — Moradas da Serra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --purple: #7F77DD; --purple-dark: #534AB7; --purple-light: #EEEDFE;
    --teal: #1D9E75; --teal-light: #E1F5EE;
    --red: #E24B4A; --red-light: #FCEBEB; --red-dark: #A32D2D;
    --amber: #EF9F27; --amber-light: #FAEEDA; --amber-dark: #854F0B;
    --border: #E0E0E0; --bg: #F5F5F5; --bg2: #FFFFFF;
    --text: #1A1A1A; --muted: #666; --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }

  header { background: linear-gradient(135deg, #534AB7, #7F77DD); padding: 20px 24px; color: #fff; }
  .header-inner { display: flex; align-items: center; gap: 14px; max-width: 960px; margin: 0 auto; }
  .logo { width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .sub { font-size: 13px; opacity: 0.8; margin-top: 2px; }
  header .sync { font-size: 11px; opacity: 0.7; margin-top: 4px; }

  .main { max-width: 960px; margin: 0 auto; padding: 24px 16px; }

  /* Blocos principais */
  .bloco { border-radius: var(--radius-lg); margin-bottom: 20px; overflow: hidden; border: 2px solid transparent; }
  .bloco-header { padding: 16px 20px; display: flex; align-items: center; gap: 14px; }
  .bloco-icon { font-size: 28px; }
  .bloco-titulo { font-size: 18px; font-weight: 700; }
  .bloco-sub { font-size: 13px; opacity: 0.85; margin-top: 2px; }
  .bloco-count { margin-left: auto; font-size: 32px; font-weight: 800; }
  .bloco-body { background: var(--bg2); padding: 16px 20px; }

  .bloco-ativo { border-color: #2DC653; }
  .bloco-ativo .bloco-header { background: #2DC653; color: #fff; }
  .bloco-fechado { border-color: #534AB7; }
  .bloco-fechado .bloco-header { background: linear-gradient(135deg,#534AB7,#7F77DD); color: #fff; }
  .bloco-descartado { border-color: #CCC; }
  .bloco-descartado .bloco-header { background: #888; color: #fff; }

  /* Mini métricas dentro do bloco ativo */
  .etapas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .etapa { background: var(--bg); border-radius: var(--radius); padding: 12px; border: 1px solid var(--border); text-align: center; }
  .etapa-n { font-size: 26px; font-weight: 700; color: var(--purple-dark); }
  .etapa-label { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* Alertas */
  .alert-box { padding: 12px 16px; border-radius: var(--radius); font-size: 13px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .alert-red { background: var(--red-light); color: var(--red-dark); border: 1px solid #F09595; }
  .alert-amber { background: var(--amber-light); color: var(--amber-dark); border: 1px solid #FAC775; }

  /* Tabela de leads */
  .leads-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  .leads-table th { text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--border); background: #FAFAFA; }
  .leads-table td { padding: 9px 12px; border-bottom: 1px solid var(--border); font-size: 13px; vertical-align: middle; }
  .leads-table tr:last-child td { border-bottom: none; }
  .leads-table tr:hover td { background: #FAFAFA; }
  .row-atrasado td { background: #FEF3EC !important; }

  .badge { display: inline-flex; padding: 3px 10px; border-radius: 100px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge-verde { background: #E1F5EE; color: #0F6E56; }
  .badge-azul { background: #E6F1FB; color: #185FA5; }
  .badge-roxo { background: #EEEDFE; color: #534AB7; }
  .badge-laranja { background: #FAEEDA; color: #854F0B; }
  .badge-cinza { background: #F3F3F3; color: #555; }

  .prazo-pill { display: inline-flex; padding: 3px 8px; border-radius: 100px; font-size: 11px; font-weight: 600; }
  .prazo-atrasado { background: var(--red-light); color: var(--red-dark); }
  .prazo-hoje { background: #FFFBEA; color: #92400E; border: 1px solid #FCD34D; }
  .prazo-futuro { background: var(--teal-light); color: var(--teal); }

  .hist-entry { padding: 8px 10px; background: #F7F7F7; border-radius: var(--radius); margin-bottom: 5px; border-left: 3px solid var(--purple); }
  .hist-meta { font-size: 11px; color: var(--muted); margin-bottom: 2px; }

  .section-title { font-size: 13px; font-weight: 600; color: var(--text); margin: 16px 0 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

  .btn-bar { display: flex; gap: 10px; justify-content: center; padding: 20px 0 8px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 20px; border-radius: var(--radius); font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border); background: #fff; color: var(--text); }
  .btn:hover { background: #F5F5F5; }
  .btn-primary { background: var(--purple); color: #fff; border-color: var(--purple); }
  .btn-primary:hover { background: var(--purple-dark); }

  .subtabs-loteador { display: flex; gap: 4px; margin-bottom: 20px; background: #fff; border-radius: var(--radius-lg); padding: 6px; border: 1px solid var(--border); width: 100%; }
  .subtab-lot { flex: 1; padding: 12px 8px; border-radius: var(--radius); border: none; background: transparent; font-size: 13px; font-weight: 500; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: all 0.15s; color: var(--muted); }
  .subtab-lot:hover { background: var(--bg); }
  .subtab-lot .tab-icon { font-size: 22px; }
  .subtab-lot .tab-label { font-size: 12px; font-weight: 600; }
  .subtab-lot .tab-count { font-size: 20px; font-weight: 800; }
  .subtab-lot.active-ativo { background: #E8FBF0; color: #0F6E56; }
  .subtab-lot.active-fechado { background: var(--purple-light); color: var(--purple-dark); }
  .subtab-lot.active-descartado { background: #F3F3F3; color: #444; }
  .lot-section { display: none; }
  .lot-section.active { display: block; }
  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { width: 36px; height: 36px; border: 3px solid #EEEDFE; border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 14px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 24px; color: var(--muted); font-size: 13px; }
  footer { text-align: center; padding: 20px; font-size: 11px; color: var(--muted); }
  @media print { .btn-bar, .sync { display: none !important; } }
  @media (max-width: 600px) { .etapas-grid { grid-template-columns: 1fr 1fr 1fr; } }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </div>
    <div>
      <h1>Moradas da Serra</h1>
      <div class="sub">Painel de acompanhamento de leads — somente leitura</div>
      <div class="sync" id="sync-status">🔄 Conectando...</div>
    </div>
  </div>
</header>

<div class="main">
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Carregando dados em tempo real...</p>
  </div>
  <div id="conteudo" style="display:none;"></div>
  <div class="btn-bar" id="btn-bar" style="display:none;">
    <button class="btn btn-primary" onclick="exportarExcel()">📊 Exportar Excel</button>
    <button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button>
  </div>
</div>

<footer>Painel somente leitura · Moradas da Serra · Trevizan Consultoria Imobiliária · Atualização em tempo real</footer>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyANrlnyfWzWw7lTOO63fhDXuhPscSiSlt8",
  authDomain: "moradas-da-serra.firebaseapp.com",
  projectId: "moradas-da-serra",
  storageBucket: "moradas-da-serra.firebasestorage.app",
  messagingSenderId: "492069160697",
  appId: "1:492069160697:web:6d13659d6a04ab39130428"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Status agrupados
const STATUS_ATIVO = ['Qualificação','Follow 1','Follow 2','Follow 3','Atendimento Consultor','Agendamento Visita','Visita ao Plantão','Proposta Apresentada','Negociação/Decisão','Novo','Contato feito','Visita agendada','Proposta enviada'];
const STATUS_FECHADO = ['Venda Ganha','Fechado'];
const STATUS_DESCARTADO = ['Sem interação','Sem interesse'];

// Nomes amigáveis para o loteador
const NOME_STATUS = {
  'Qualificação':'Lead recebido','Follow 1':'Em atendimento','Follow 2':'Em atendimento',
  'Follow 3':'Em atendimento','Atendimento Consultor':'Com consultor',
  'Agendamento Visita':'Visita agendada','Visita ao Plantão':'Visitou o plantão',
  'Proposta Apresentada':'Proposta enviada','Negociação/Decisão':'Em negociação',
  'Venda Ganha':'Venda fechada','Fechado':'Venda fechada',
  'Novo':'Em atendimento','Contato feito':'Em atendimento',
  'Visita agendada':'Visita agendada','Proposta enviada':'Proposta enviada',
  'Sem interação':'Não respondeu','Sem interesse':'Desistiu'
};

const BADGE_STATUS = {
  'Lead recebido':'badge-azul','Em atendimento':'badge-laranja','Com consultor':'badge-roxo',
  'Visita agendada':'badge-roxo','Visitou o plantão':'badge-roxo','Proposta enviada':'badge-verde',
  'Em negociação':'badge-verde','Venda fechada':'badge-verde','Não respondeu':'badge-cinza','Desistiu':'badge-cinza'
};

// Etapas do funil para exibir no bloco ativo
const ETAPAS = [
  { label: 'Lead recebido',    statuses: ['Qualificação','Novo'] },
  { label: 'Em atendimento',   statuses: ['Follow 1','Follow 2','Follow 3','Contato feito'] },
  { label: 'Com consultor',    statuses: ['Atendimento Consultor'] },
  { label: 'Visita agendada',  statuses: ['Agendamento Visita','Visita agendada'] },
  { label: 'Visitou plantão',  statuses: ['Visita ao Plantão'] },
  { label: 'Proposta enviada', statuses: ['Proposta Apresentada','Proposta enviada'] },
  { label: 'Em negociação',    statuses: ['Negociação/Decisão'] },
];

let _leadsCache = [];

function hoje() { return new Date().toISOString().slice(0,10); }
function toISO(br) {
  if (!br || br==='-') return '';
  if (br.includes('-')) return br;
  const p = br.split('/'); return p.length===3 ? p[2]+'-'+p[1]+'-'+p[0] : '';
}
function toBR(iso) {
  if (!iso || iso==='-') return '-';
  if (iso.includes('/')) return iso;
  const p = iso.split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : iso;
}
function diffDias(val) {
  const iso = toISO(val); if (!iso) return null;
  const d = new Date(iso+'T00:00:00'), h = new Date(hoje()+'T00:00:00');
  return Math.round((d-h)/86400000);
}
function prazoInfo(val) {
  const d = diffDias(val); if (d===null) return null;
  if (d<0) return { label: Math.abs(d)+'d atrasado', cls: 'prazo-atrasado', tipo: 'atrasado' };
  if (d===0) return { label: 'Hoje!', cls: 'prazo-hoje', tipo: 'hoje' };
  return { label: 'em '+d+'d', cls: 'prazo-futuro', tipo: 'futuro' };
}
function nomeFriendly(s) { return NOME_STATUS[s] || s; }
function badge(s) {
  const n = nomeFriendly(s);
  const cls = BADGE_STATUS[n] || 'badge-cinza';
  return `<span class="badge ${cls}">${n}</span>`;
}

function renderTudo(leads) {
  _leadsCache = leads;
  const ativos = leads.filter(l => STATUS_ATIVO.includes(l.status));
  const fechados = leads.filter(l => STATUS_FECHADO.includes(l.status));
  const descartados = leads.filter(l => STATUS_DESCARTADO.includes(l.status));

  const atrasados = ativos.filter(l => { const d=diffDias(l.proximo); return d!==null&&d<0; });
  const hojeRet = ativos.filter(l => { const d=diffDias(l.proximo); return d===0; });

  const agora = new Date().toLocaleString('pt-BR');

  // Etapas do funil
  const etapasHtml = ETAPAS.map(e => {
    const n = ativos.filter(l => e.statuses.includes(l.status)).length;
    return `<div class="etapa"><div class="etapa-n">${n}</div><div class="etapa-label">${e.label}</div></div>`;
  }).join('');

  // Tabela ativos
  const pendentes = ativos.filter(l => l.proximo && l.proximo!=='-').sort((a,b)=>toISO(a.proximo).localeCompare(toISO(b.proximo)));
  const semRetorno = ativos.filter(l => !l.proximo || l.proximo==='-');

  // Histórico de atendimentos (ativos)
  const comHist = {};
  ativos.forEach(l => {
    const hist = l.historico&&l.historico.length ? l.historico : (l.feedback?[{texto:l.feedback,data:l.data,corretor:l.corretor}]:[]);
    if (hist.length) comHist[l.phone] = {nome:l.nome,phone:l.phone,status:l.status,corretor:l.corretor,hist};
  });

  document.getElementById('conteudo').innerHTML = `
    ${atrasados.length ? `<div class="alert-box alert-red">⚠️ <strong>${atrasados.length} lead(s)</strong> com retorno atrasado — requer atenção!</div>` : ''}
    ${hojeRet.length ? `<div class="alert-box alert-amber">🔔 <strong>${hojeRet.length} lead(s)</strong> com retorno agendado para hoje</div>` : ''}

    <!-- ABAS -->
    <div class="subtabs-loteador">
      <button class="subtab-lot active-ativo" id="lot-btn-ativo" onclick="switchLotTab('ativo')">
        <span class="tab-icon">🟢</span>
        <span class="tab-count" id="lot-count-ativo">${ativos.length}</span>
        <span class="tab-label">Em atendimento</span>
      </button>
      <button class="subtab-lot" id="lot-btn-fechado" onclick="switchLotTab('fechado')">
        <span class="tab-icon">🏆</span>
        <span class="tab-count" id="lot-count-fechado">${fechados.length}</span>
        <span class="tab-label">Vendas fechadas</span>
      </button>
      <button class="subtab-lot" id="lot-btn-descartado" onclick="switchLotTab('descartado')">
        <span class="tab-icon">❌</span>
        <span class="tab-count" id="lot-count-descartado">${descartados.length}</span>
        <span class="tab-label">Descartados</span>
      </button>
    </div>

    <!-- ABA ATIVO -->
    <div class="lot-section active" id="lot-sec-ativo">
      <div class="etapas-grid">${etapasHtml}</div>

      ${pendentes.length ? `
      <div class="section-title">🔔 Retornos agendados</div>
      <table class="leads-table">
        <thead><tr><th>Nome</th><th>Etapa</th><th>Corretor</th><th>Próx. contato</th><th>Situação</th></tr></thead>
        <tbody>${pendentes.map(l=>{
          const pi=prazoInfo(l.proximo);
          return `<tr class="${pi&&pi.tipo==='atrasado'?'row-atrasado':''}">
            <td style="font-weight:600">${l.nome}</td>
            <td>${badge(l.status)}</td>
            <td style="font-size:12px">${l.corretor}</td>
            <td style="font-size:12px">${toBR(l.proximo)}</td>
            <td>${pi?`<span class="prazo-pill ${pi.cls}">${pi.label}</span>`:'-'}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>` : ''}

      <div class="section-title">📋 Todos os leads em atendimento</div>
      <table class="leads-table">
        <thead><tr><th>Nome</th><th>Etapa</th><th>Corretor</th><th>Último atendimento</th><th>Data</th></tr></thead>
        <tbody>${ativos.map(l=>{
          const hist=l.historico&&l.historico.length?l.historico:(l.feedback?[{texto:l.feedback,data:l.data,corretor:l.corretor}]:[]);
          const ult=hist.length?hist[hist.length-1]:{texto:'Sem registro',data:l.data,corretor:''};
          return `<tr>
            <td style="font-weight:600">${l.nome}</td>
            <td>${badge(l.status)}</td>
            <td style="font-size:12px">${l.corretor}</td>
            <td style="font-size:12px;color:#555;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${ult.texto}">${ult.texto}</td>
            <td style="font-size:12px;white-space:nowrap">${l.data}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>

      ${Object.values(comHist).length ? `
      <div class="section-title">💬 Histórico completo de atendimentos</div>
      ${Object.values(comHist).map(g=>`
        <div style="margin-bottom:14px;">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
            <span style="font-weight:600">${g.nome}</span>
            ${badge(g.status)}
            <span style="font-size:12px;color:var(--muted)">· ${g.corretor}</span>
          </div>
          ${[...g.hist].reverse().map(r=>`
            <div class="hist-entry">
              <div class="hist-meta">📅 ${r.data||''}${r.hora?' · '+r.hora:''}${r.corretor?' · '+r.corretor:''}</div>
              <div style="font-size:13px">${r.texto}</div>
            </div>`).join('')}
        </div>`).join('<hr style="border:none;border-top:1px solid var(--border);margin:10px 0;">')}
      ` : ''}
    </div>

    <!-- ABA FECHADO -->
    <div class="lot-section" id="lot-sec-fechado">
      ${fechados.length ? `<table class="leads-table">
        <thead><tr><th>Nome</th><th>Telefone</th><th>Corretor</th><th>Data</th></tr></thead>
        <tbody>${fechados.map(l=>`<tr>
          <td style="font-weight:600">${l.nome}</td>
          <td style="font-family:monospace;font-size:12px">${l.phone}</td>
          <td style="font-size:12px">${l.corretor}</td>
          <td style="font-size:12px;white-space:nowrap">${l.data}</td>
        </tr>`).join('')}</tbody>
      </table>` : '<div class="empty">Nenhuma venda fechada ainda</div>'}
    </div>

    <!-- ABA DESCARTADO -->
    <div class="lot-section" id="lot-sec-descartado">
      ${descartados.length ? `<table class="leads-table">
        <thead><tr><th>Nome</th><th>Motivo</th><th>Corretor</th><th>Último registro</th></tr></thead>
        <tbody>${descartados.map(l=>{
          const hist=l.historico&&l.historico.length?l.historico:(l.feedback?[{texto:l.feedback,data:l.data}]:[]);
          const ult=hist.length?hist[hist.length-1].texto:'-';
          return `<tr style="opacity:0.7">
            <td style="font-weight:600">${l.nome}</td>
            <td>${badge(l.status)}</td>
            <td style="font-size:12px">${l.corretor}</td>
            <td style="font-size:12px;color:var(--muted)">${ult}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>` : '<div class="empty">Nenhum lead descartado</div>'}
    </div>

    <div style="text-align:center;font-size:11px;color:var(--muted);padding:16px 0 4px;">Última atualização: ${agora} · Total: ${leads.length} leads</div>
  `;

    document.getElementById('loading').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
  document.getElementById('btn-bar').style.display = 'flex';
  document.getElementById('sync-status').textContent = `🟢 Ao vivo · ${leads.length} leads · Atualizado agora`;
}

function switchLotTab(tab) {
  ['ativo','fechado','descartado'].forEach(t => {
    document.getElementById('lot-btn-'+t).className = 'subtab-lot';
    document.getElementById('lot-sec-'+t).classList.remove('active');
  });
  document.getElementById('lot-btn-'+tab).className = 'subtab-lot active-'+tab;
  document.getElementById('lot-sec-'+tab).classList.add('active');
}

function exportarExcel() {
  if (!_leadsCache.length) { alert('Sem dados.'); return; }
  if (!window.XLSX) { alert('Aguarde e tente novamente.'); return; }
  const leads = _leadsCache;
  const wb = XLSX.utils.book_new();
  const hoje2 = new Date().toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'});
  const ativos = leads.filter(l=>STATUS_ATIVO.includes(l.status));
  const fechados = leads.filter(l=>STATUS_FECHADO.includes(l.status));
  const descartados = leads.filter(l=>STATUS_DESCARTADO.includes(l.status));

  // Resumo
  const res = [
    ['RELATÓRIO DE LEADS — MORADAS DA SERRA'],['Trevizan Consultoria Imobiliária'],['Gerado em: '+hoje2],[],
    ['RESUMO','Qtd'],
    ['Total de leads', leads.length],
    ['Em atendimento', ativos.length],
    ['Vendas fechadas', fechados.length],
    ['Descartados', descartados.length],
    ['Taxa de conversão', leads.length?Math.round(fechados.length/leads.length*100)+'%':'0%'],
    [],['ETAPAS DO FUNIL','Qtd'],
  ];
  ETAPAS.forEach(e=>{
    const n=ativos.filter(l=>e.statuses.includes(l.status)).length;
    res.push([e.label, n]);
  });
  const wsR = XLSX.utils.aoa_to_sheet(res);
  wsR['!cols']=[{wch:30},{wch:12}];
  XLSX.utils.book_append_sheet(wb, wsR, '📊 Resumo');

  // Ativos
  const hA=['Nome','Telefone','Etapa','Corretor','Último atendimento','Data','Próx. retorno'];
  const rA=ativos.map(l=>{
    const hist=l.historico&&l.historico.length?l.historico:(l.feedback?[{texto:l.feedback}]:[]);
    const ult=hist.length?hist[hist.length-1].texto:'-';
    return [l.nome,l.phone,nomeFriendly(l.status),l.corretor,ult,l.data,l.proximo||'-'];
  });
  const wsA=XLSX.utils.aoa_to_sheet([hA,...rA]);
  wsA['!cols']=[{wch:26},{wch:16},{wch:18},{wch:16},{wch:40},{wch:13},{wch:14}];
  wsA['!autofilter']={ref:'A1:G1'};
  XLSX.utils.book_append_sheet(wb,wsA,'🟢 Em atendimento');

  // Fechados
  const hF=['Nome','Telefone','Corretor','Data'];
  const rF=fechados.map(l=>[l.nome,l.phone,l.corretor,l.data]);
  const wsF=XLSX.utils.aoa_to_sheet([hF,...rF]);
  wsF['!cols']=[{wch:26},{wch:16},{wch:16},{wch:13}];
  XLSX.utils.book_append_sheet(wb,wsF,'🏆 Vendas Fechadas');

  // Histórico
  const hH=['Nome','Telefone','Etapa','Corretor','Data','Feedback'];
  const rH=[];
  leads.forEach(l=>{
    const hist=l.historico&&l.historico.length?l.historico:(l.feedback?[{texto:l.feedback,data:l.data,corretor:l.corretor}]:[]);
    hist.forEach(h=>rH.push([l.nome,l.phone,nomeFriendly(l.status),h.corretor||l.corretor,h.data||l.data,h.texto||'']));
  });
  if(rH.length){
    const wsH=XLSX.utils.aoa_to_sheet([hH,...rH]);
    wsH['!cols']=[{wch:26},{wch:16},{wch:18},{wch:16},{wch:13},{wch:55}];
    XLSX.utils.book_append_sheet(wb,wsH,'💬 Histórico');
  }
  XLSX.writeFile(wb,'relatorio_moradas_'+new Date().toISOString().slice(0,10)+'.xlsx');
}

db.collection('leads').orderBy('ts','desc').onSnapshot(snapshot => {
  renderTudo(snapshot.docs.map(d=>d.data()));
}, err => {
  document.getElementById('sync-status').textContent = '🔴 Erro de conexão';
  document.getElementById('loading').innerHTML = '<p style="color:#A32D2D">❌ Erro ao carregar. Verifique a conexão.</p>';
});
</script>
</body>
